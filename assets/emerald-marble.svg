<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice">
<title>MYLIFTCOACH original emerald marble stone texture</title>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2=".83" y2="1">
  <stop stop-color="#0d4b4e"/><stop offset=".2" stop-color="#17696b"/>
  <stop offset=".46" stop-color="#063c41"/><stop offset=".68" stop-color="#1b6b6b"/>
  <stop offset="1" stop-color="#0a4146"/>
 </linearGradient>
 <radialGradient id="sea" cx=".22" cy=".16" r=".9">
  <stop stop-color="#72b4ac" stop-opacity=".44"/><stop offset=".37" stop-color="#1d7778" stop-opacity=".17"/>
  <stop offset="1" stop-color="#063d42" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="v" cx=".52" cy=".48" r=".79">
  <stop offset=".5" stop-color="#000" stop-opacity="0"/>
  <stop offset="1" stop-color="#001e25" stop-opacity=".50"/>
 </radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2=".3">
  <stop stop-color="#815e33"/><stop offset=".22" stop-color="#e5ba70"/>
  <stop offset=".46" stop-color="#fff3ba"/><stop offset=".69" stop-color="#c79653"/>
  <stop offset=".88" stop-color="#f6dba0"/><stop offset="1" stop-color="#9b713f"/>
 </linearGradient>
 <filter id="stone" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency=".0049 .0081" numOctaves="6" seed="24" result="clouds"/>
  <feColorMatrix in="clouds" type="matrix" values="0.11 0.21 0.09 0 0.005  0.09 0.26 0.13 0 0.055  0.10 0.24 0.18 0 0.060  0 0 0 .55 0" result="tint"/>
  <feComposite in="tint" in2="SourceGraphic" operator="in"/>
 </filter>
 <filter id="strata" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency=".003 .014" numOctaves="4" seed="13" result="noise"/>
  <feDisplacementMap in="SourceGraphic" in2="noise" scale="54" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="fissure" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency=".011 .009" numOctaves="2" seed="51" result="noise"/>
  <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
 <filter id="haze"><feGaussianBlur stdDeviation="23"/></filter>
</defs>
<rect width="900" height="1600" fill="url(#base)"/>
<rect width="900" height="1600" fill="url(#sea)"/>
<!-- Source-owned mineral grain rather than a CSS overlay -->
<rect width="900" height="1600" fill="#9ac8bf" opacity=".31" filter="url(#stone)"/>
<g filter="url(#haze)" opacity=".33">
 <path d="M-90 250Q180 90 342 295T1030 185 M-100 750Q160 580 354 800T1010 730 M-100 1370Q280 1190 487 1385T1010 1310" fill="none" stroke="#8cd1c4" stroke-width="67"/>
 <path d="M40 -40Q200 200 125 440T375 910Q460 1050 385 1320" fill="none" stroke="#022d37" stroke-width="88"/>
</g>
<g filter="url(#strata)" fill="none" stroke-linecap="round">
 <path d="M-90 168Q150 265 269 126T590 103Q770 135 1000 -30" stroke="#c0f0dd" stroke-opacity=".19" stroke-width="16"/>
 <path d="M-30 440Q145 285 340 442T940 347" stroke="#82c6b6" stroke-opacity=".24" stroke-width="28"/>
 <path d="M-60 660Q245 495 410 707T1000 594" stroke="#c1ebdf" stroke-opacity=".18" stroke-width="22"/>
 <path d="M-100 985Q200 805 417 1010T1030 913" stroke="#91cabb" stroke-opacity=".29" stroke-width="29"/>
 <path d="M-40 1318Q210 1100 389 1327T990 1254" stroke="#ccede2" stroke-opacity=".17" stroke-width="30"/>
 <path d="M-70 1535Q240 1400 510 1545T980 1440" stroke="#9ed4c8" stroke-opacity=".2" stroke-width="26"/>
</g>
<!-- Thin, branching metallic mineral fissures (the previous thick outlines are removed) -->
<g filter="url(#fissure)" fill="none" stroke-linejoin="round" stroke-linecap="round">
 <path d="M-32 440C125 388 140 267 254 191S438 46 561 -43" stroke="#10373c" stroke-width="5.2" opacity=".52"/>
 <path d="M-32 440C125 388 140 267 254 191S438 46 561 -43" stroke="url(#gold)" stroke-width="2.1" opacity=".85"/>
 <path d="M255 190Q213 145 229 79 M143 323Q203 363 198 418" stroke="#e1c18a" stroke-width=".8" opacity=".74"/>
 <path d="M947 320C816 342 788 473 658 515S465 623 345 665S163 765 22 790" stroke="#092e34" stroke-width="5" opacity=".52"/>
 <path d="M947 320C816 342 788 473 658 515S465 623 345 665S163 765 22 790" stroke="url(#gold)" stroke-width="2.1" opacity=".81"/>
 <path d="M659 516Q677 454 723 415 M345 666Q391 735 376 775" stroke="#f9dfae" stroke-width=".85" opacity=".68"/>
 <path d="M-42 1110C153 1020 239 1111 369 1033S571 1012 668 1072S818 1170 943 1112" stroke="#0b3236" stroke-width="5" opacity=".54"/>
 <path d="M-42 1110C153 1020 239 1111 369 1033S571 1012 668 1072S818 1170 943 1112" stroke="url(#gold)" stroke-width="2.2" opacity=".83"/>
 <path d="M369 1034Q396 969 468 933 M668 1072Q634 1139 657 1210" stroke="#f1dbab" stroke-width=".8" opacity=".62"/>
 <path d="M887 1645C787 1482 641 1524 565 1436S328 1303 148 1401S-10 1510 -58 1550" stroke="url(#gold)" stroke-width="2" opacity=".76"/>
 <path d="M565 1437Q618 1388 665 1398" stroke="#edd5a1" stroke-width=".8" opacity=".61"/>
</g>
<g filter="url(#strata)" fill="none" stroke="#bfe9db" stroke-opacity=".21" stroke-width="1.6">
 <path d="M-60 95Q185 65 277 210T635 220Q789 159 931 90"/>
 <path d="M-90 862Q182 730 329 900T953 842"/>
 <path d="M-80 1494Q157 1354 298 1512T947 1460"/>
</g>
<rect width="900" height="1600" fill="url(#v)"/>
</svg>