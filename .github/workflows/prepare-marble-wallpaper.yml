name: Optimize approved marble for tall mobile screens
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-marble-wallpaper.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image processor
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Reflow user's approved source into a tall, sharp image
        run: |
          node --input-type=module <<'JS'
          import sharp from 'sharp';
          import fs from 'node:fs';
          const src='assets/approved-emerald-marble.webp';
          const img=sharp(src);
          const {width,height}=await img.metadata();
          if(!width||!height||width<600||height<300)throw Error('Approved marble image missing or invalid');
          const base=await sharp(src).sharpen({sigma:0.9,m1:0.45,m2:1.4}).toBuffer();
          const flipped=await sharp(base).flip().toBuffer();
          // Reflect neighboring bands to avoid harsh horizontal edges. Every strip
          // retains source resolution; no enlarged blurry background stretch.
          const tiles=Array.from({length:5},(_,i)=>({input:i%2?flipped:base,left:0,top:height*i}));
          await sharp({create:{width,height:height*5,channels:3,background:'#08494c'}})
            .composite(tiles).webp({quality:78,effort:6})
            .toFile('assets/approved-emerald-marble-portrait.webp');
          const out=await sharp('assets/approved-emerald-marble-portrait.webp').metadata();
          if(out.width!==width||out.height!==height*5)throw Error('Wallpaper shape mismatch');
          console.log(JSON.stringify({source:src,width:out.width,height:out.height,bytes:fs.statSync('assets/approved-emerald-marble-portrait.webp').size}));
          JS
      - name: Commit source-derived wallpaper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved-emerald-marble-portrait.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add portrait-scaled approved marble wallpaper without CSS upscaling"
            git push origin HEAD:main
          fi
