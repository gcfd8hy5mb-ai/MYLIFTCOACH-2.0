name: Publish isolated MYLIFTCOACH 2.0 iPhone beta preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-beta-preview.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: myliftcoach2-beta-pages
  cancel-in-progress: true

jobs:
  publish-beta-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved MYLIFTCOACH 2.0 development snapshot (not production)
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/workout-tracker
          ref: 9148282ea0ce31607fc45533e7c482b3dd044b3f
          path: source
          persist-credentials: false
      - name: Checkout exact original approved visual assets (read-only)
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: 45f105cb94b72d16f15a67bcdb1a10722f1c44c8
          path: original-approved
          persist-credentials: false
      - name: Checkout verified integration candidate for iPhone-only testing
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: f1dede5135bc770686b481360b4ab076982d661d
          path: phone-candidate
          persist-credentials: false
      - name: Checkout all-user Free-Pro beta candidate for separate iPhone preview
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: 78458093c3277c8104a309a180e8e8e00cee1ff5
          path: phone-freepro
          persist-credentials: false
      - name: Checkout verified expanded Coach candidate for separate iPhone preview
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: 77b00b05c079f66450395984574ab9bd748f4867
          path: phone-coach
          persist-credentials: false
      - name: Checkout verified custom/Home priority build for isolated iPhone preview
        uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: 0cd53db474c864339c821579c48ce871ad02bab2
          path: phone-custom
          persist-credentials: false
      - name: Package static beta preview only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -a source/myliftcoach2 dist/myliftcoach2
          # Approved 11/16 marble texture and hero photography from the original
          # visual preview. Never pull workout logic or user data from that repo.
          cp original-approved/assets/approved-vertical-marble-sharp.webp dist/myliftcoach2/assets/approved-vertical-marble-sharp.webp
          cp original-approved/assets/hero-dumbbells-photo.jpg dist/myliftcoach2/assets/hero-dumbbells-photo.jpg
          test -s dist/myliftcoach2/assets/approved-vertical-marble-sharp.webp
          test -s dist/myliftcoach2/assets/hero-dumbbells-photo.jpg
          # Build a distinct iPhone acceptance area without modifying the
          # original /myliftcoach2/ or root landing content.
          mkdir -p dist/phone-test
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' \
            --exclude='*.md' phone-candidate/ dist/phone-test/
          # Pin the same approved image assets as the unchanged beta.
          cp original-approved/assets/approved-vertical-marble-sharp.webp dist/phone-test/assets/approved-vertical-marble-sharp.webp
          cp original-approved/assets/hero-dumbbells-photo.jpg dist/phone-test/assets/hero-dumbbells-photo.jpg
          test -s dist/phone-test/index.html
          test -s dist/phone-test/app.js
          test -s dist/phone-test/sync/automatic-workouts.js
          test -s dist/phone-test/sync/auxiliary-cloud.js
          test -s dist/phone-test/assets/approved-vertical-marble-sharp.webp
          test -s dist/phone-test/assets/hero-dumbbells-photo.jpg
          # A NEW URL defeats Safari/PWA caches from previous test versions.
          cp -a dist/phone-test dist/phone-test-c
          grep -q 'iPhone cloud test build 11-21C' dist/phone-test-c/index.html
          grep -q 'normalizeCloudSession' dist/phone-test-c/sync/automatic-workouts.js
          grep -q 'app.js?v=7' dist/phone-test-c/index.html
          # Additional beta path: preserve previously verified C cloud recovery build.
          mkdir -p dist/phone-test-d
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' \
            --exclude='*.md' phone-freepro/ dist/phone-test-d/
          cp original-approved/assets/approved-vertical-marble-sharp.webp dist/phone-test-d/assets/approved-vertical-marble-sharp.webp
          cp original-approved/assets/hero-dumbbells-photo.jpg dist/phone-test-d/assets/hero-dumbbells-photo.jpg
          grep -q 'iPhone beta test build 11-21D' dist/phone-test-d/index.html
          grep -q 'app.js?v=9' dist/phone-test-d/index.html
          grep -q 'beta-access.js?v=3' dist/phone-test-d/index.html
          test -s dist/phone-test-d/beta-access.js
          test -s dist/phone-test-d/app.js
          test -s dist/phone-test-d/sync/automatic-workouts.js
          # Coach expansion preview is isolated from the proven cloud test.
          mkdir -p dist/phone-test-e
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' \
            --exclude='*.md' phone-coach/ dist/phone-test-e/
          cp original-approved/assets/approved-vertical-marble-sharp.webp dist/phone-test-e/assets/approved-vertical-marble-sharp.webp
          cp original-approved/assets/hero-dumbbells-photo.jpg dist/phone-test-e/assets/hero-dumbbells-photo.jpg
          grep -q 'iPhone beta test build 11-21E' dist/phone-test-e/index.html
          grep -q 'coach-catalog-coverage.js?v=2' dist/phone-test-e/index.html
          grep -q 'coach-migration.js?v=3' dist/phone-test-e/index.html
          test -s dist/phone-test-e/coach-catalog-coverage.js
          test -s dist/phone-test-e/coach-migration.js
          test -s dist/phone-test-e/sync/automatic-workouts.js
          # Keep earlier test areas immutable; add custom-workout acceptance separately.
          mkdir -p dist/phone-test-f
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' \
            --exclude='*.md' phone-custom/ dist/phone-test-f/
          cp original-approved/assets/approved-vertical-marble-sharp.webp dist/phone-test-f/assets/approved-vertical-marble-sharp.webp
          cp original-approved/assets/hero-dumbbells-photo.jpg dist/phone-test-f/assets/hero-dumbbells-photo.jpg
          grep -q 'iPhone beta test build 11-21F' dist/phone-test-f/index.html
          grep -q 'app.js?v=10' dist/phone-test-f/index.html
          grep -q 'dataset.homeWorkout=plan.id' dist/phone-test-f/app.js
          test -s dist/phone-test-f/custom-workouts.js
          test -s dist/phone-test-f/weekly-workout-schedule.js
          test -s dist/phone-test-f/sync/automatic-workouts.js
          cp -a source/persistence dist/persistence
          cp source/liftova-anatomy.css dist/liftova-anatomy.css
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class URLs(HTMLParser):
              def __init__(self):super().__init__();self.urls=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ('script','img') and a.get('src'):self.urls.append(a['src'])
                  if tag=='link' and a.get('href'):self.urls.append(a['href'])
          root=Path('dist/myliftcoach2/index.html')
          parser=URLs();parser.feed(root.read_text())
          missing=[]
          for raw in parser.urls:
              uri=raw.split('?',1)[0]
              if uri.startswith(('https:', 'http:', 'data:', '#', '/')):continue
              if not (root.parent/uri).is_file():missing.append(uri)
          if missing:raise SystemExit('Missing beta assets: '+repr(missing))
          print('Verified',len(parser.urls),'HTML static asset links in isolated preview')
          phone=Path('dist/phone-test/index.html')
          mobile=URLs();mobile.feed(phone.read_text())
          missing_phone=[]
          for raw in mobile.urls:
              uri=raw.split('?',1)[0]
              if uri.startswith(('https:', 'http:', 'data:', '#', '/')):continue
              if not (phone.parent/uri).is_file():missing_phone.append(uri)
          if missing_phone:raise SystemExit('Missing iPhone test assets: '+repr(missing_phone))
          print('Verified',len(mobile.urls),'HTML static asset links in phone-only candidate')
          freepro=Path('dist/phone-test-d/index.html')
          freepro_urls=URLs();freepro_urls.feed(freepro.read_text())
          missing_freepro=[]
          for raw in freepro_urls.urls:
              uri=raw.split('?',1)[0]
              if uri.startswith(('https:', 'http:', 'data:', '#', '/')):continue
              if not (freepro.parent/uri).is_file():missing_freepro.append(uri)
          if missing_freepro:raise SystemExit('Missing Free/Pro beta assets: '+repr(missing_freepro))
          print('Verified',len(freepro_urls.urls),'iPhone open-beta HTML links')
          coach=Path('dist/phone-test-e/index.html')
          coach_urls=URLs();coach_urls.feed(coach.read_text())
          missing_coach=[]
          for raw in coach_urls.urls:
              uri=raw.split('?',1)[0]
              if uri.startswith(('https:', 'http:', 'data:', '#', '/')):continue
              if not (coach.parent/uri).is_file():missing_coach.append(uri)
          if missing_coach:raise SystemExit('Missing Coach beta assets: '+repr(missing_coach))
          print('Verified',len(coach_urls.urls),'Coach beta HTML links')
          custom=Path('dist/phone-test-f/index.html')
          custom_urls=URLs();custom_urls.feed(custom.read_text())
          missing_custom=[]
          for raw in custom_urls.urls:
              uri=raw.split('?',1)[0]
              if uri.startswith(('https:', 'http:', 'data:', '#', '/')):continue
              if not (custom.parent/uri).is_file():missing_custom.append(uri)
          if missing_custom:raise SystemExit('Missing custom workout beta assets: '+repr(missing_custom))
          print('Verified',len(custom_urls.urls),'custom workout beta HTML links')
          PY
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0; url=./myliftcoach2/">
          <title>MYLIFTCOACH 2.0 Beta</title></head>
          <body><a href="./myliftcoach2/">Open MYLIFTCOACH 2.0 Beta</a></body>
          </html>
          HTML
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Allow GitHub artifact metadata to become visible
        run: sleep 20
      - name: Deploy to separate beta repository GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
