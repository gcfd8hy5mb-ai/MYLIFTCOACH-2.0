name: MYLIFTCOACH 2.0 regression

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/exercise-placeholder-migration-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline regression suite
        run: node tests/run-all.js
