name: MYLIFTCOACH 2.0 regression

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/exercise-placeholder-migration-prep
      - integration/coach-cloud-beta-20261120
      - integration/replacement-visual-coach-20261122
      - review/codex-final-integration-20261122
      - fix/active-workout-close-safe-area-20261122
      - fix/iphone-home-screen-update-delivery-20261122
      - fix/iphone-workout-close-overlay-20261122
      - fix/weekly-follow-and-approved-workout-cards-20261122
      - fix/scheduled-routines-vs-unused-presets-20261122
      - fix/visible-library-thumbnails-20261122
      - fix/library-thumbnails-left-20261122
      - fix/library-image-css-escape-and-structure-20261122
      - fix/library-start-position-thumbnails-20261122
      - fix/global-marble-text-readability-20261122
      - fix/easier-custom-workout-builder-teal-20261122
      - fix/optional-exercise-targets-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check integration JavaScript syntax
        run: |
          node --check app.js
          node --check sync/account-workout-store.js
          node --check sync/cloud-session-inspection.js
          node --check sync/verified-auth.js
          node --check sync/completed-workout-bridge.js
          node --check sync/account-recovery.js
          node --check sync/account-draft-store.js
          node --check sync/automatic-workouts.js
          node --check sync/auxiliary-cloud.js
          node --check custom-workouts.js
          node --check body-progress.js
          node --check coach-readiness.js
          node --check weekly-workout-schedule.js
          node --check beta-access.js
          node --check sync/refresh-session.js
      - name: Run offline regression suite
        run: node tests/run-all.js
