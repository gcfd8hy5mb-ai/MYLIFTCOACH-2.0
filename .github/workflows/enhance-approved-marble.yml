name: Enhance approved marble sharpness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enhance-approved-marble.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install sharp
        run: npm install --no-save --no-package-lock sharp@0.34.4
      - name: Sharpen the exact user-approved portrait image
        run: |
          node --input-type=module <<'JS'
          import sharp from 'sharp';
          import fs from 'node:fs';
          const input='assets/approved-vertical-marble.jpg';
          const output='assets/approved-vertical-marble-sharp.webp';
          const meta=await sharp(input).metadata();
          if(meta.width !== 1037 || meta.height !== 1536) throw new Error('Unexpected original image dimensions');
          // Preserve the user's exact marble composition and colors.
          // Retina-sized Lanczos resampling plus restrained unsharp masking
          // reduces the softness caused by iPhone background upscaling.
          await sharp(input)
            .resize({width:2074,kernel:'lanczos3',withoutEnlargement:false})
            .sharpen({sigma:1.15,m1:0.4,m2:1.7})
            .webp({quality:92,effort:6})
            .toFile(output);
          const final=await sharp(output).metadata();
          if(final.width!==2074||final.height!==3072) throw new Error('Unexpected enhanced dimensions');
          console.log(JSON.stringify({input:{width:meta.width,height:meta.height},output:{width:final.width,height:final.height,bytes:fs.statSync(output).size}}));
          JS
      - name: Save enhanced source image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/approved-vertical-marble-sharp.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Produce high-quality retina marble asset from approved source'
            git push origin HEAD:main
          fi
