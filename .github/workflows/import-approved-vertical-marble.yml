name: Install user-approved vertical marble image
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-vertical-marble.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact image attached in the conversation
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --location --silent --show-error --retry 3 --max-time 90 'https://9bfbc956-4679-43fe-88d4-220af901697c.sandbox.floot.app/_cdn/static/af15bef2-8a54-4add-946b-4e3d1a00a462-myliftcoach-vertical-approved-marble.jpeg' -o assets/approved-vertical-marble.jpg
          echo '2eb107d19f5d91d81e310fd1fc7d02300063fd14d3af40a76d1d2a142e91754e  assets/approved-vertical-marble.jpg' | sha256sum -c -
      - name: Commit image to the source repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/approved-vertical-marble.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Install exact approved portrait emerald marble image'
            git push origin HEAD:main
          fi
