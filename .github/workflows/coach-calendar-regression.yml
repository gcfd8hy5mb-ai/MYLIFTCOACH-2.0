name: Coach calendar regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --test tests/coach-calendar-day.test.cjs
