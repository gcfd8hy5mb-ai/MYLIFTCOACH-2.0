name: Verify 344 Exercise Visuals
on:
  push:
    branches:
      - feature/344-approved-exercise-visuals
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-exercise-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out image integration branch
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all 344 exercise visuals and image mappings
        run: node --test tests/exercise-visuals-344.test.cjs
