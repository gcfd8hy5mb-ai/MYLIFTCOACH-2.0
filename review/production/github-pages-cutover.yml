# Uninstalled template for gcfd8hy5mb-ai/workout-tracker. Review the runbook before use.
name: MYLIFTCOACH approved production cutover
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed 2.0 commit
        required: true
        type: string
      operation:
        description: Release operation
        required: true
        type: choice
        options: [replacement, rollback]
      approval:
        description: Enter RELEASE MYLIFTCOACH to authorize the selected operation
        required: true
        type: string
permissions:
  contents: read
# The original repo's other Pages deploy workflows must be paused at cutover.
concurrency:
  group: pages-refs/heads/main
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'gcfd8hy5mb-ai/workout-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require explicit release operation and an immutable source
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          APPROVAL: ${{ inputs.approval }}
          APPROVED_CANDIDATE: ${{ vars.MLC2_APPROVED_RELEASE_SHA }}
        run: |
          set -euo pipefail
          [[ "$APPROVAL" == "RELEASE MYLIFTCOACH" && "$CANDIDATE" =~ ^[0-9a-f]{40}$ && "$CANDIDATE" == "$APPROVED_CANDIDATE" ]]
      - uses: actions/checkout@v4
        with:
          ref: 24b3e3a40076f8d6aeb6fe6c603068652b268351
          path: original
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: ${{ inputs.candidate_sha }}
          path: source
          persist-credentials: false
          token: ${{ secrets.MLC2_SOURCE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Package and verify the exact approved release
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          OPERATION: ${{ inputs.operation }}
          MLC2_REPLACEMENT_PACKAGE: ${{ github.workspace }}/output
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$CANDIDATE" ]]
          node source/review/production/package.cjs original output
          node --test source/review/production/package-integration.test.cjs source/review/production/migration-preview.test.cjs source/review/production/pages-gate.test.cjs
          [[ "$OPERATION" == "replacement" || "$OPERATION" == "rollback" ]]
          if [[ "$OPERATION" == "replacement" ]]; then
            for file in index.html manifest.json sw.js; do
              curl -fsS "https://gcfd8hy5mb-ai.github.io/workout-tracker/$file" -o live-file
              [[ "$(sha256sum live-file | cut -d' ' -f1)" == "$(git -C original show "HEAD:$file" | sha256sum | cut -d' ' -f1)" ]]
            done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/${{ inputs.operation }}
  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: gcfd8hy5mb-ai/MYLIFTCOACH-2.0
          ref: ${{ inputs.candidate_sha }}
          path: source
          persist-credentials: false
          token: ${{ secrets.MLC2_SOURCE_READ_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Block competing Pages publishers immediately before deployment
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
          APPROVED_CANDIDATE: ${{ vars.MLC2_APPROVED_RELEASE_SHA }}
          MLC2_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git -C source rev-parse HEAD)" == "$CANDIDATE" ]]
          node source/review/production/pages-gate.cjs
      - uses: actions/configure-pages@v5
        id: pages
      - name: Verify existing production Pages URL
        env:
          TARGET: ${{ steps.pages.outputs.base_url }}
        run: test "${TARGET%/}" = 'https://gcfd8hy5mb-ai.github.io/workout-tracker'
      - uses: actions/deploy-pages@v4
        id: deployment
